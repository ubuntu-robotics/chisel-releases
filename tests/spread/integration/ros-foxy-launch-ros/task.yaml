summary: Integration tests for ros-foxy-launch-ros

execute: |
  rootfs="$(install-slices ros-foxy-launch-ros_libs)"

  # launch_ros imports rclpy, whose C extension dlopen's librclpy_common.so.
  # With no LD_LIBRARY_PATH set, that falls back to the linker's default path
  # + cache, so the ROS conf.d entry only takes effect after ldconfig builds
  # /etc/ld.so.cache. Build it with the sliced ldconfig first.
  test -f "$rootfs"/etc/ld.so.conf.d/00-ros-foxy.conf
  chroot "$rootfs" /sbin/ldconfig
  test -f "$rootfs"/etc/ld.so.cache

  # The python module imports under the sliced python3.8, no LD_LIBRARY_PATH.
  AMENT_PREFIX_PATH=/opt/ros/foxy chroot "$rootfs" /usr/bin/python3.8 -c \
    "import sys; sys.path.insert(0, '/opt/ros/foxy/lib/python3.8/site-packages'); \
     import launch_ros"

  # ament index marker, so get_package_prefix() finds the package.
  index="$rootfs/opt/ros/foxy/share/ament_index/resource_index"
  test -f "$index/packages/launch_ros"
