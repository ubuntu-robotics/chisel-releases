summary: Integration tests for ros-foxy-rosidl-typesupport-introspection-c

execute: |
  rootfs="$(install-slices ros-foxy-rosidl-typesupport-introspection-c_libs)"

  loader="$(find "$rootfs"/lib64 "$rootfs"/lib \
    -name 'ld-linux-*.so.*' -o -name 'ld-*.so' 2>/dev/null | head -1)"
  test -n "$loader"

  # Every shipped library resolves all its deps inside the slice closure.
  libs="$(find "$rootfs"/opt/ros/foxy/lib -maxdepth 1 -name 'lib*.so*' -type f)"
  test -n "$libs"
  for lib in $libs; do
    if chroot "$rootfs" "${loader#"$rootfs"}" \
      --library-path /opt/ros/foxy/lib --list "${lib#"$rootfs"}" \
      2>&1 | grep -Eiq "not found|error while loading"; then
      echo "unresolved deps in $lib"; exit 1
    fi
  done

  # ament markers: package prefix + typesupport registration (read only by
  # CMake; runtime lookup finds the lib by name on LD_LIBRARY_PATH).
  index="$rootfs/opt/ros/foxy/share/ament_index/resource_index"
  test -f "$index/packages/rosidl_typesupport_introspection_c"
  test -f "$index/rosidl_typesupport_c/rosidl_typesupport_introspection_c"
