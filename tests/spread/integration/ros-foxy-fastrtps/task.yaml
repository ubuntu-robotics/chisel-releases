summary: Integration tests for ros-foxy-fastrtps

execute: |
  rootfs="$(install-slices ros-foxy-fastrtps_libs)"

  loader="$(find "$rootfs"/lib64 "$rootfs"/lib \
    -name 'ld-linux-*.so.*' -o -name 'ld-*.so' 2>/dev/null | head -1)"
  test -n "$loader"

  # Every shipped library resolves all its deps inside the slice closure.
  # --library-path is needed because the fastcdr dependency also lives in
  # /opt/ros/foxy/lib, which is not on the loader's default search path.
  libs="$(find "$rootfs"/opt/ros/foxy/lib -maxdepth 1 -name 'lib*.so*' -type f)"
  test -n "$libs"
  for lib in $libs; do
    if chroot "$rootfs" "${loader#"$rootfs"}" \
      --library-path /opt/ros/foxy/lib --list "${lib#"$rootfs"}" \
      2>&1 | grep -Eiq "not found|error while loading"; then
      echo "unresolved deps in $lib"; exit 1
    fi
  done

  # The copyright slice is pulled in by the global essential.
  test -f "$rootfs"/usr/share/doc/ros-foxy-fastrtps/copyright
