summary: Integration tests for python3-defusedxml

execute: |
  rootfs="$(install-slices python3-defusedxml_libs)"

  # The package imports cleanly under the sliced python3.8.
  chroot "$rootfs" /usr/bin/python3.8 -c "import defusedxml"

  test -f "$rootfs"/usr/share/doc/python3-defusedxml/copyright
