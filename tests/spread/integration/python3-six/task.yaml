summary: Integration tests for python3-six

execute: |
  # python3-six_libs: fresh rootfs so a missing dep can't hide behind another
  # test.
  rootfs="$(install-slices python3-six_libs)"

  # The module imports and works inside the sliced rootfs.
  chroot "$rootfs" /usr/bin/python3.8 -c \
    "import six; six.print_('six', six.PY3)" | grep -Fiq "six True"
