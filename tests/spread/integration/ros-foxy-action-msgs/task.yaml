summary: Integration tests for ros-foxy-action-msgs

execute: |
  rootfs="$(install-slices ros-foxy-action-msgs_libs ros-foxy-action-msgs_python)"

  loader="$(find "$rootfs"/lib64 "$rootfs"/lib \
    -name 'ld-linux-*.so.*' -o -name 'ld-*.so' 2>/dev/null | head -1)"
  test -n "$loader"

  # Every shipped library resolves all its deps inside the slice closure.
  libs="$(find "$rootfs"/opt/ros/foxy/lib -maxdepth 1 -name 'lib*.so*' -type f)"
  test -n "$libs"
  for lib in $libs; do
    if chroot "$rootfs" "${loader#"$rootfs"}" \
      --library-path /opt/ros/foxy/lib --list "${lib#"$rootfs"}" \
      2>&1 | grep -Eiq "not found|error while loading"; then
      echo "unresolved deps in $lib"; exit 1
    fi
  done

  # ament index marker, so get_package_prefix() finds the package.
  index="$rootfs/opt/ros/foxy/share/ament_index/resource_index"
  test -f "$index/packages/action_msgs"
  # The python message package imports (site-packages + C extension) under the
  # sliced python3.8.
  chroot "$rootfs" /usr/bin/python3.8 -c \
    "import sys; sys.path.insert(0, '/opt/ros/foxy/lib/python3.8/site-packages'); \
     import action_msgs.msg"

  # interfaces: every definition the index lists is shipped.
  rootfs="$(install-slices ros-foxy-action-msgs_interfaces)"
  index="$rootfs/opt/ros/foxy/share/ament_index/resource_index"
  test -f "$index/packages/action_msgs"
  test -s "$index/rosidl_interfaces/action_msgs"
  for def in $(cat "$index/rosidl_interfaces/action_msgs"); do
    test -f "$rootfs/opt/ros/foxy/share/action_msgs/$def" || exit 1
  done
