package: libblas3

essential:
  - libblas3_copyright

slices:
  libs:
    essential:
      - libc6_libs
    contents:
      # The deb's maintainer script wires the soname via update-alternatives;
      # chisel does not run maintainer scripts, so create the links directly.
      # Without it the loader cannot find libblas.so.3 on the default path.
      /etc/alternatives/libblas.so.3-aarch64-linux-gnu:
        {symlink: /usr/lib/aarch64-linux-gnu/blas/libblas.so.3, arch: arm64}
      /etc/alternatives/libblas.so.3-arm-linux-gnueabihf:
        {symlink: /usr/lib/arm-linux-gnueabihf/blas/libblas.so.3, arch: armhf}
      /etc/alternatives/libblas.so.3-i386-linux-gnu:
        {symlink: /usr/lib/i386-linux-gnu/blas/libblas.so.3, arch: i386}
      /etc/alternatives/libblas.so.3-powerpc64le-linux-gnu:
        {symlink: /usr/lib/powerpc64le-linux-gnu/blas/libblas.so.3, arch: ppc64el}
      /etc/alternatives/libblas.so.3-s390x-linux-gnu:
        {symlink: /usr/lib/s390x-linux-gnu/blas/libblas.so.3, arch: s390x}
      /etc/alternatives/libblas.so.3-x86_64-linux-gnu:
        {symlink: /usr/lib/x86_64-linux-gnu/blas/libblas.so.3, arch: amd64}
      /usr/lib/*-linux-*/blas/libblas.so.3*:
      /usr/lib/aarch64-linux-gnu/libblas.so.3:
        {symlink: /etc/alternatives/libblas.so.3-aarch64-linux-gnu, arch: arm64}
      /usr/lib/arm-linux-gnueabihf/libblas.so.3:
        {symlink: /etc/alternatives/libblas.so.3-arm-linux-gnueabihf, arch: armhf}
      /usr/lib/i386-linux-gnu/libblas.so.3:
        {symlink: /etc/alternatives/libblas.so.3-i386-linux-gnu, arch: i386}
      /usr/lib/powerpc64le-linux-gnu/libblas.so.3:
        {symlink: /etc/alternatives/libblas.so.3-powerpc64le-linux-gnu, arch: ppc64el}
      /usr/lib/s390x-linux-gnu/libblas.so.3:
        {symlink: /etc/alternatives/libblas.so.3-s390x-linux-gnu, arch: s390x}
      /usr/lib/x86_64-linux-gnu/libblas.so.3:
        {symlink: /etc/alternatives/libblas.so.3-x86_64-linux-gnu, arch: amd64}

  copyright:
    contents:
      /usr/share/doc/libblas3/copyright:
