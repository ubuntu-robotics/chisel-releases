package: ros-foxy-rclcpp-lifecycle

archive: ubuntu-esm-ros

# This deb ships no copyright file (ROS ESM repackaging), so there is no
# copyright slice to declare.

slices:
  libs:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libstdc++6_libs
      - ros-foxy-lifecycle-msgs_libs
      - ros-foxy-rcl-lifecycle_libs
      - ros-foxy-rcl_libs
      - ros-foxy-rclcpp_libs
      - ros-foxy-rcutils_libs
      - ros-foxy-tracetools_libs
    contents:
      /opt/ros/foxy/lib/librclcpp_lifecycle.so:
      /opt/ros/foxy/share/ament_index/resource_index/packages/rclcpp_lifecycle:
