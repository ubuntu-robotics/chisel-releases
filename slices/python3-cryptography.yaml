package: python3-cryptography

essential:
  - python3-cryptography_copyright

slices:
  libs:
    essential:
      - libc6_libs
      - libssl1.1_libs
      - python3-cffi-backend_libs
      - python3-six_libs
      - python3.8_standard
    contents:
      /usr/lib/python3/dist-packages/cryptography-*.egg-info/:
      /usr/lib/python3/dist-packages/cryptography-*.egg-info/*:
      /usr/lib/python3/dist-packages/cryptography/:
      /usr/lib/python3/dist-packages/cryptography/**:

  copyright:
    contents:
      /usr/share/doc/python3-cryptography/copyright:
