package: python3-lxml

essential:
  - python3-lxml_copyright

slices:
  libs:
    essential:
      - libc6_libs
      - libxml2_libs
      - libxslt1.1_libs
      - python3.8_standard
    contents:
      /usr/lib/python3/dist-packages/lxml-*.egg-info/:
      /usr/lib/python3/dist-packages/lxml-*.egg-info/*:
      /usr/lib/python3/dist-packages/lxml/:
      # Skip the Cython .pxd and C headers, only needed to build against lxml.
      /usr/lib/python3/dist-packages/lxml/**.py:
      /usr/lib/python3/dist-packages/lxml/**.so:
      /usr/lib/python3/dist-packages/lxml/isoschematron/resources/**:

  copyright:
    contents:
      /usr/share/doc/python3-lxml/copyright:
