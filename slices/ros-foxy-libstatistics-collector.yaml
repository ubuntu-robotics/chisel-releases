package: ros-foxy-libstatistics-collector

archive: ubuntu-esm-ros

# This deb ships no copyright file (ROS ESM repackaging), so there is no
# copyright slice to declare.

slices:
  # The liblibstatistics_collector_test_msgs__* libs are unit-test artifacts
  # and deliberately not shipped.
  libs:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libstdc++6_libs
    contents:
      /opt/ros/foxy/lib/liblibstatistics_collector.so:
      /opt/ros/foxy/share/ament_index/resource_index/packages/libstatistics_collector:
