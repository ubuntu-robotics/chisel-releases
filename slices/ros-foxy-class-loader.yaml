package: ros-foxy-class-loader

archive: ubuntu-esm-ros

# This deb ships no copyright file (ROS ESM repackaging), so there is no
# copyright slice to declare.

slices:
  libs:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libstdc++6_libs
      - ros-foxy-console-bridge-vendor_libs
      - ros-foxy-rcpputils_libs
    contents:
      /opt/ros/foxy/lib/libclass_loader.so:
      /opt/ros/foxy/share/ament_index/resource_index/packages/class_loader:
