package: ros-foxy-ros2topic

archive: ubuntu-esm-ros

# This deb ships no copyright file (ROS ESM repackaging), so there is no
# copyright slice to declare.

slices:
  libs:
    essential:
      # python3-numpy (deb Depends) is dropped: never imported (rosidl-runtime-py has it).
      - python3-yaml_libs
      - python3.8_standard
      - ros-foxy-rclpy_libs
      - ros-foxy-ros2cli_libs
      - ros-foxy-rosidl-parser_libs
      - ros-foxy-rosidl-runtime-py_libs
    contents:
      /opt/ros/foxy/lib/python3.8/site-packages/ros2topic-*.egg-info/:
      /opt/ros/foxy/lib/python3.8/site-packages/ros2topic-*.egg-info/*:
      /opt/ros/foxy/lib/python3.8/site-packages/ros2topic/:
      /opt/ros/foxy/lib/python3.8/site-packages/ros2topic/**:
      /opt/ros/foxy/share/ament_index/resource_index/packages/ros2topic:
