package: ros-foxy-rclcpp-components

archive: ubuntu-esm-ros

# This deb ships no copyright file (ROS ESM repackaging), so there is no
# copyright slice to declare.

slices:
  libs:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libstdc++6_libs
      - ros-foxy-ament-index-cpp_libs
      - ros-foxy-class-loader_libs
      - ros-foxy-composition-interfaces_libs
      - ros-foxy-console-bridge-vendor_libs
      - ros-foxy-rcl_libs
      - ros-foxy-rclcpp_libs
      - ros-foxy-rcutils_libs
      - ros-foxy-tracetools_libs
    contents:
      /opt/ros/foxy/lib/libcomponent_manager.so:
      # The container executables are looked up by launch_ros via
      # get_executable_path() as <prefix>/lib/rclcpp_components/<exe>.
      /opt/ros/foxy/lib/rclcpp_components/component_container:
      /opt/ros/foxy/lib/rclcpp_components/component_container_mt:
      /opt/ros/foxy/share/ament_index/resource_index/packages/rclcpp_components:
