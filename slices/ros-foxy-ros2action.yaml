package: ros-foxy-ros2action

archive: ubuntu-esm-ros

# This deb ships no copyright file (ROS ESM repackaging), so there is no
# copyright slice to declare.

slices:
  libs:
    essential:
      - python3.8_standard
      - ros-foxy-action-msgs_python
      - ros-foxy-ament-index-python_libs
      - ros-foxy-rclpy_libs
      - ros-foxy-ros2cli_libs
      - ros-foxy-rosidl-runtime-py_libs
    contents:
      /opt/ros/foxy/lib/python3.8/site-packages/ros2action-*.egg-info/:
      /opt/ros/foxy/lib/python3.8/site-packages/ros2action-*.egg-info/*:
      /opt/ros/foxy/lib/python3.8/site-packages/ros2action/:
      /opt/ros/foxy/lib/python3.8/site-packages/ros2action/**:
      /opt/ros/foxy/share/ament_index/resource_index/packages/ros2action:
