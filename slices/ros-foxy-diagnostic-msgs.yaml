package: ros-foxy-diagnostic-msgs

archive: ubuntu-esm-ros

# This deb ships no copyright file (ROS ESM repackaging), so there is no
# copyright slice to declare.

slices:
  interfaces:
    contents:
      /opt/ros/foxy/share/ament_index/resource_index/packages/diagnostic_msgs:
      /opt/ros/foxy/share/ament_index/resource_index/rosidl_interfaces/diagnostic_msgs:
      /opt/ros/foxy/share/diagnostic_msgs/msg/*:
      /opt/ros/foxy/share/diagnostic_msgs/srv/*:

  libs:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libstdc++6_libs
      # builtin-interfaces and geometry-msgs (deb Depends) aren't linked.
      - ros-foxy-fastcdr_libs
      - ros-foxy-rosidl-runtime-c_libs
      - ros-foxy-rosidl-typesupport-c_libs
      - ros-foxy-rosidl-typesupport-cpp_libs
      - ros-foxy-rosidl-typesupport-fastrtps-c_libs
      - ros-foxy-rosidl-typesupport-fastrtps-cpp_libs
      - ros-foxy-rosidl-typesupport-introspection-c_libs
      - ros-foxy-rosidl-typesupport-introspection-cpp_libs
      - ros-foxy-std-msgs_libs
    contents:
      /opt/ros/foxy/lib/libdiagnostic_msgs__rosidl_*.so:
      /opt/ros/foxy/share/ament_index/resource_index/packages/diagnostic_msgs:

  python:
    essential:
      - libc6_libs
      - libpython3.8_libs
      - python3.8_standard
      - ros-foxy-diagnostic-msgs_libs
      - ros-foxy-rosidl-generator-py_libs
      - ros-foxy-rosidl-parser_libs
      - ros-foxy-rosidl-runtime-c_libs
      - ros-foxy-std-msgs_python
    contents:
      /opt/ros/foxy/lib/libdiagnostic_msgs__python.so:
      /opt/ros/foxy/lib/python3.8/site-packages/diagnostic_msgs/:
      /opt/ros/foxy/lib/python3.8/site-packages/diagnostic_msgs/**.py:
      /opt/ros/foxy/lib/python3.8/site-packages/diagnostic_msgs/**.so:
