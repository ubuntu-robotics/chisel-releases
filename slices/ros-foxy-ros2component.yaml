package: ros-foxy-ros2component

archive: ubuntu-esm-ros

# This deb ships no copyright file (ROS ESM repackaging), so there is no
# copyright slice to declare.

slices:
  libs:
    essential:
      - python3.8_standard
      - ros-foxy-ament-index-python_libs
      - ros-foxy-composition-interfaces_python
      - ros-foxy-rcl-interfaces_python
      - ros-foxy-rclcpp-components_libs
      - ros-foxy-rclpy_libs
      - ros-foxy-ros2cli_libs
      - ros-foxy-ros2node_libs
      - ros-foxy-ros2param_libs
      - ros-foxy-ros2pkg_libs
    contents:
      /opt/ros/foxy/lib/python3.8/site-packages/ros2component-*.egg-info/:
      /opt/ros/foxy/lib/python3.8/site-packages/ros2component-*.egg-info/*:
      /opt/ros/foxy/lib/python3.8/site-packages/ros2component/:
      /opt/ros/foxy/lib/python3.8/site-packages/ros2component/**:
      /opt/ros/foxy/share/ament_index/resource_index/packages/ros2component:
