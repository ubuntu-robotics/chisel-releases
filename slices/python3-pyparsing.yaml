package: python3-pyparsing

essential:
  - python3-pyparsing_copyright

slices:
  libs:
    essential:
      - python3.8_standard
    contents:
      /usr/lib/python3/dist-packages/pyparsing-*.egg-info/:
      /usr/lib/python3/dist-packages/pyparsing-*.egg-info/*:
      /usr/lib/python3/dist-packages/pyparsing.py:

  copyright:
    contents:
      /usr/share/doc/python3-pyparsing/copyright:
