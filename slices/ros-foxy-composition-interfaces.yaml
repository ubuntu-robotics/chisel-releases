package: ros-foxy-composition-interfaces

archive: ubuntu-esm-ros

# This deb ships no copyright file (ROS ESM repackaging), so there is no
# copyright slice to declare.

slices:
  interfaces:
    contents:
      /opt/ros/foxy/share/ament_index/resource_index/packages/composition_interfaces:
      /opt/ros/foxy/share/ament_index/resource_index/rosidl_interfaces/composition_interfaces:
      /opt/ros/foxy/share/composition_interfaces/srv/*:

  libs:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libstdc++6_libs
      - ros-foxy-fastcdr_libs
      - ros-foxy-rcl-interfaces_libs
      - ros-foxy-rcutils_libs
      - ros-foxy-rosidl-runtime-c_libs
      - ros-foxy-rosidl-typesupport-c_libs
      - ros-foxy-rosidl-typesupport-cpp_libs
      - ros-foxy-rosidl-typesupport-fastrtps-c_libs
      - ros-foxy-rosidl-typesupport-fastrtps-cpp_libs
      - ros-foxy-rosidl-typesupport-introspection-c_libs
      - ros-foxy-rosidl-typesupport-introspection-cpp_libs
    contents:
      /opt/ros/foxy/lib/libcomposition_interfaces__rosidl_*.so:
      /opt/ros/foxy/share/ament_index/resource_index/packages/composition_interfaces:

  python:
    essential:
      - libc6_libs
      - libpython3.8_libs
      - python3.8_standard
      - ros-foxy-composition-interfaces_libs
      - ros-foxy-rcl-interfaces_libs
      - ros-foxy-rcl-interfaces_python
      - ros-foxy-rosidl-generator-py_libs
      - ros-foxy-rosidl-parser_libs
      - ros-foxy-rosidl-runtime-c_libs
    contents:
      /opt/ros/foxy/lib/libcomposition_interfaces__python.so:
      /opt/ros/foxy/lib/python3.8/site-packages/composition_interfaces/:
      /opt/ros/foxy/lib/python3.8/site-packages/composition_interfaces/**.py:
      /opt/ros/foxy/lib/python3.8/site-packages/composition_interfaces/**.so:
