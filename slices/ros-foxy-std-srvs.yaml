package: ros-foxy-std-srvs

archive: ubuntu-esm-ros

# This deb ships no copyright file (ROS ESM repackaging), so there is no
# copyright slice to declare.

slices:
  interfaces:
    contents:
      /opt/ros/foxy/share/ament_index/resource_index/packages/std_srvs:
      /opt/ros/foxy/share/ament_index/resource_index/rosidl_interfaces/std_srvs:
      /opt/ros/foxy/share/std_srvs/srv/*:

  libs:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libstdc++6_libs
      - ros-foxy-fastcdr_libs
      - ros-foxy-rosidl-runtime-c_libs
      - ros-foxy-rosidl-typesupport-c_libs
      - ros-foxy-rosidl-typesupport-cpp_libs
      - ros-foxy-rosidl-typesupport-fastrtps-c_libs
      - ros-foxy-rosidl-typesupport-fastrtps-cpp_libs
      - ros-foxy-rosidl-typesupport-introspection-c_libs
      - ros-foxy-rosidl-typesupport-introspection-cpp_libs
    contents:
      /opt/ros/foxy/lib/libstd_srvs__rosidl_*.so:
      /opt/ros/foxy/share/ament_index/resource_index/packages/std_srvs:

  python:
    essential:
      - libc6_libs
      - libpython3.8_libs
      - python3.8_standard
      - ros-foxy-rosidl-generator-py_libs
      - ros-foxy-rosidl-parser_libs
      - ros-foxy-rosidl-runtime-c_libs
      - ros-foxy-std-srvs_libs
    contents:
      /opt/ros/foxy/lib/libstd_srvs__python.so:
      /opt/ros/foxy/lib/python3.8/site-packages/std_srvs/:
      /opt/ros/foxy/lib/python3.8/site-packages/std_srvs/**.py:
      /opt/ros/foxy/lib/python3.8/site-packages/std_srvs/**.so:
