package: ros-foxy-rosgraph-msgs

archive: ubuntu-esm-ros

# This deb ships no copyright file (ROS ESM repackaging), so there is no
# copyright slice to declare.

slices:
  interfaces:
    contents:
      /opt/ros/foxy/share/ament_index/resource_index/packages/rosgraph_msgs:
      /opt/ros/foxy/share/ament_index/resource_index/rosidl_interfaces/rosgraph_msgs:
      /opt/ros/foxy/share/rosgraph_msgs/msg/*:

  libs:
    essential:
      - libc6_libs
      - libstdc++6_libs
      - ros-foxy-builtin-interfaces_libs
      - ros-foxy-rcutils_libs
      - ros-foxy-rosidl-runtime-c_libs
      - ros-foxy-rosidl-typesupport-c_libs
      - ros-foxy-rosidl-typesupport-cpp_libs
      - ros-foxy-rosidl-typesupport-fastrtps-c_libs
      - ros-foxy-rosidl-typesupport-fastrtps-cpp_libs
      - ros-foxy-rosidl-typesupport-introspection-c_libs
      - ros-foxy-rosidl-typesupport-introspection-cpp_libs
    contents:
      /opt/ros/foxy/lib/librosgraph_msgs__rosidl_*.so:
      /opt/ros/foxy/share/ament_index/resource_index/packages/rosgraph_msgs:

  python:
    essential:
      - libc6_libs
      - libpython3.8_libs
      - python3.8_standard
      - ros-foxy-builtin-interfaces_python
      - ros-foxy-rosgraph-msgs_libs
      - ros-foxy-rosidl-generator-py_libs
      - ros-foxy-rosidl-parser_libs
    contents:
      /opt/ros/foxy/lib/librosgraph_msgs__python.so:
      /opt/ros/foxy/lib/python3.8/site-packages/rosgraph_msgs/:
      /opt/ros/foxy/lib/python3.8/site-packages/rosgraph_msgs/**.py:
      /opt/ros/foxy/lib/python3.8/site-packages/rosgraph_msgs/**.so:
