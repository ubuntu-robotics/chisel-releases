package: ros-foxy-rcl-logging-spdlog

archive: ubuntu-esm-ros

# This deb ships no copyright file (ROS ESM repackaging), so there is no
# copyright slice to declare.

slices:
  libs:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libspdlog1_libs
      - libstdc++6_libs
      - ros-foxy-rcutils_libs
    contents:
      /opt/ros/foxy/lib/librcl_logging_spdlog.so:
      /opt/ros/foxy/share/ament_index/resource_index/packages/rcl_logging_spdlog:
