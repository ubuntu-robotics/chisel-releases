package: ros-foxy-rosidl-typesupport-cpp

archive: ubuntu-esm-ros

# This deb ships no copyright file (ROS ESM repackaging), so there is no
# copyright slice to declare.

slices:
  libs:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libstdc++6_libs
      - ros-foxy-rcpputils_libs
      # ros-foxy-rosidl-typesupport-c (deb Depends) is dropped: never linked or loaded.
    contents:
      /opt/ros/foxy/lib/librosidl_typesupport_cpp.so:
      /opt/ros/foxy/share/ament_index/resource_index/packages/rosidl_typesupport_cpp:
