package: python3-cffi-backend

essential:
  - python3-cffi-backend_copyright

slices:
  libs:
    essential:
      - libc6_libs
      - libffi7_libs
      - python3.8_standard
    contents:
      /usr/lib/python3/dist-packages/_cffi_backend.cpython-*-*.so:

  copyright:
    contents:
      /usr/share/doc/python3-cffi-backend/copyright:
