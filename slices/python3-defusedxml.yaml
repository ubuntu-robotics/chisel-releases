package: python3-defusedxml

essential:
  - python3-defusedxml_copyright

slices:
  libs:
    essential:
      - python3.8_standard
    contents:
      /usr/lib/python3/dist-packages/defusedxml-*.egg-info/:
      /usr/lib/python3/dist-packages/defusedxml-*.egg-info/*:
      /usr/lib/python3/dist-packages/defusedxml/:
      /usr/lib/python3/dist-packages/defusedxml/*:

  copyright:
    contents:
      /usr/share/doc/python3-defusedxml/copyright:
