package: ros-foxy-ros-workspace

archive: ubuntu-esm-ros

essential:
  - ros-foxy-ros-workspace_copyright

slices:
  # The workspace anchor: setup/local_setup scripts and the ament marker that
  # every ros-foxy package Depends on. Sourcing setup.sh needs bash/sh, so this
  # is primarily the marker + env hookup for sliced rootfs consumers.
  setup:
    essential:
      - libc-bin_ldconfig
    contents:
      # Put the ROS lib dirs on the default dynamic-linker search path so
      # dlopen'd ROS libraries (e.g. librclpy_common.so) resolve without
      # LD_LIBRARY_PATH. ld.so.cache is regenerated by libc-bin's ldconfig.
      # The vendored multiarch dir of every ROS ESM arch is listed; ldconfig
      # skips the ones that don't exist.
      /etc/ld.so.conf.d/00-ros-foxy.conf:
        text: |
          /opt/ros/foxy/lib
          /opt/ros/foxy/lib/aarch64-linux-gnu
          /opt/ros/foxy/lib/arm-linux-gnueabihf
          /opt/ros/foxy/lib/i386-linux-gnu
          /opt/ros/foxy/lib/x86_64-linux-gnu
      /opt/ros/foxy/_local_setup_util.py:
      /opt/ros/foxy/local_setup.bash:
      /opt/ros/foxy/local_setup.sh:
      /opt/ros/foxy/local_setup.zsh:
      /opt/ros/foxy/setup.bash:
      /opt/ros/foxy/setup.sh:
      /opt/ros/foxy/setup.zsh:
      /opt/ros/foxy/share/ament_index/resource_index/packages/ros_workspace:

  copyright:
    contents:
      /usr/share/doc/ros-foxy-ros-workspace/copyright:
