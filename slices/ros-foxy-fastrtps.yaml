package: ros-foxy-fastrtps

archive: ubuntu-esm-ros

essential:
  - ros-foxy-fastrtps_copyright

slices:
  libs:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libstdc++6_libs
      - libtinyxml2-6a_libs
      - ros-foxy-fastcdr_libs
    contents:
      /opt/ros/foxy/lib/libfastrtps.so.2*:

  copyright:
    contents:
      /usr/share/doc/ros-foxy-fastrtps/copyright:
